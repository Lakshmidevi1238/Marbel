services:
  mysql:
    image: mysql:8.0
    container_name: marblejar-mysql
    restart: always
    environment:
      MYSQL_DATABASE: marblejar
      MYSQL_USER: marblejar_user
      MYSQL_PASSWORD: marblejar_pass
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: marblejar-backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8081:8080"




  frontend:
    build: ./frontend
    container_name: marblejar-frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"

volumes:
  mysql_data:
